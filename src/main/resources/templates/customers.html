<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/customers.css"/>
    <link rel="stylesheet" href="/css/nav-bar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <title>Customers page</title>
</head>
<body>

<th:block th:insert="fragments/nav-bar :: main-header(${user})"></th:block>

<main>
    <table>
        <thead>
        <tr>
            <th>Customer Name</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="customer : ${allSystemCustomers}">
            <td th:text="${customer.firstName + ' ' + customer.lastName}"></td>
            <td>
                <form th:action="@{'/customers/' + ${customer.id} + '/promote'}" th:method="POST">
                    <button type="submit" class="promote-btn">Promote to Courier</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

</body>


</html>
