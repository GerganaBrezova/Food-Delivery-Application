<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>


    <title>Home page</title>
</head>
<body>
<header class="main-header">
    <div class="header-left">
        <img src="/images/home.jpg" alt="Logo" />
    </div>
    <div class="header-content">
        <h1 class="welcome-title">Welcome to Our Page!</h1>
        <h2 class="welcome-text">It’s time to power up your <br>day with flavor and focus. Grab your coffee (or pizza?) and let’s get things rolling.</h2>
            <br>
            <br>
            <br>
            <br>
            <br>
            <nav class="header-nav">
                <a th:href="@{/home}" class="nav-button"><i class="fas fa-home"></i> Home</a>
                <a href="#" class="nav-button"><i class="fas fa-shopping-basket"></i> Basket</a>
                <a href="#" class="nav-button" th:if="${user.role.name() == 'EMPLOYEE'}">
                    <i class="fas fa-chart-bar"></i>
                    Statistics
                </a>
                <a href="#" class="nav-button"><i class="fas fa-receipt"></i> Orders</a>
                <a href="#" class="nav-button"><i class="fas fa-user"></i> Profile</a>
            </nav>
    </div>
</header>

<form class="top-controls" th:if="${user.role.name() == 'EMPLOYEE'}">
    <button class="add-button">+</button>
</form>

<main class="brands-container" th:if="${user.role.name() == 'EMPLOYEE' or user.role.name() == 'CUSTOMER'}">

    <div class="brand-card" th:each="company : ${allCompanies}">
        <img th:src="${company.logoUrl}" th:alt="${company.name}" />
        <div class="brand-info">
            <h3 th:text="${company.name}"></h3>
            <p th:text="${company.description}"></p>
        </div>
    </div>

</main>

<div class="start-day" th:if="${user.role.name() == 'COURIER'}">
    <h2 class="start-day-title">Ready to start your day?</h2>
    <br>
    <br>
    <a href="#" class="start-button">Start Work Day</a>
    <br>
    <br>
    <br>
    <p class="start-day-message">Start with a smile, stay on time, and bring great vibes to every delivery!</p>
</div>



</body>



</html>
