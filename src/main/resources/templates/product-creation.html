<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="product-creation.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>


    <title>Product Creation</title>
</head>
<body>
<header class="main-header">
    <div class="header-left">
        <img src="home.jpg" alt="Logo" />
    </div>
    <div class="header-content">
        <h1 class="welcome-title">Welcome to Our Page!</h1>
        <h2 class="welcome-text">It’s time to power up your <br>day with flavor and focus. Grab your coffee (or pizza?) and let’s get things rolling.</h1>
            <br>
            <br>
            <br>
            <br>
            <br>
            <nav class="header-nav">
                <a href="#" class="nav-button"><i class="fas fa-home"></i> Home</a>
                <a href="#" class="nav-button"><i class="fas fa-shopping-basket"></i> Basket</a>
                <a href="#" class="nav-button"><i class="fas fa-chart-bar"></i> Statistics</a>
                <a href="#" class="nav-button"><i class="fas fa-receipt"></i> Orders</a>
                <a href="#" class="nav-button"><i class="fas fa-user"></i> Profile</a>
            </nav>
    </div>

</header>

<main class="add-brand-form">

    <div class="products-section">
        <h1>Add products</h1>

        <div class="product-row">
            <input type="text" name="productName[]" placeholder="Product name" />
            <input type="number" name="productPrice[]" placeholder="Price" />
            <select name="productCategory[]">
                <option value="appetizer">Appetizer</option>
                <option value="main">Main</option>
                <option value="drink">Drink</option>
                <option value="dessert">Dessert</option>
            </select>
            <button type="button" class="remove-btn">×</button>
        </div>

        <button type="button" id="addProductBtn">+ Add product</button>
    </div>

    <button type="submit" class="submitBtn">Save brand</button>

    </form>
</main>

<script>
    const addProductBtn = document.getElementById('addProductBtn');
    const productsSection = document.querySelector('.products-section');

    addProductBtn.addEventListener('click', () => {
      const productRow = document.createElement('div');
      productRow.classList.add('product-row');
      productRow.innerHTML = `
        <input type="text" name="productName[]" placeholder="Product name" />
        <input type="number" name="productPrice[]" placeholder="Price" />
        <select name="productCategory[]">
          <option value="appetizer">Appetizer</option>
          <option value="main">Main</option>
          <option value="drink">Drink</option>
          <option value="dessert">Dessert</option>
        </select>
        <button type="button" class="remove-btn">×</button>
      `;
      productsSection.insertBefore(productRow, addProductBtn);

      const removeBtn = productRow.querySelector('.remove-btn');
      removeBtn.addEventListener('click', () => {
        productRow.remove();
      });
    });

    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.target.parentElement.remove();
      });
    });
</script>

</body>
