<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/orders.css"/>
    <link rel="stylesheet" href="/css/nav-bar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <title>Orders</title>
</head>
<body>

<th:block th:insert="fragments/nav-bar :: main-header(${user})"></th:block>

<main class="orders-page">

    <br>
    <h1>Order Tracking & History</h1>

    <p class="no-orders" th:if="${#lists.isEmpty(userOrders)}">You still do not have any orders!</p>

    <section class="order-tracking" th:if="${#lists.isEmpty(userOrders) == false}">

        <h2>Track Your Orders</h2>
        <br>
        <div class="tracking-container" th:each="order : ${userOrders}">

            <p class="order-id" th:text="${'ID: ' + #strings.substring(order.id, 0, 3)} + '..'"></p>

            <div class="tracking-steps">

                <div class="step completed">
                    <div class="circle"></div>
                    <p>Order Sent</p>
                </div>

                <div class="line"></div>

                <div th:classappend="${order.status.name() == 'COURIER_FOUND' or order.status.name() == 'PICKED_UP' or order.status.name() == 'DELIVERED' ? 'step completed' : 'step'}">
                    <div class="circle"></div>
                    <p>Courier Found</p>
                </div>

                <div class="line"></div>

                <div th:classappend="${order.status.name() == 'PICKED_UP' or order.status.name() == 'DELIVERED' ? 'step completed' : 'step'}">
                    <div class="circle"></div>
                    <p>Picked Up</p>
                </div>

                <div class="line"></div>

                <div th:classappend="${order.status.name() == 'DELIVERED' ? 'step completed' : 'step'}">
                    <div class="circle"></div>
                    <p>Delivered</p>
                </div>


            </div>
        </div>
    </section>

    <section class="order-history" th:if="${#lists.isEmpty(userOrders) == false}">
        <h2>Orders History</h2>
        <table>
            <thead>
            <tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Total</th>
                <th>Products</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="order : ${userOrders}">
                <td th:text="${order.id}"></td>
                <td th:text="${#temporals.format(order.createdOn, 'dd MMM yyyy - HH:mm')}"></td>
                <td th:text="'$' + ${#numbers.formatDecimal(order.totalPrice, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${order.products.size()}"></td>
            </tr>

            </tbody>
        </table>
    </section>

</main>

</body>
