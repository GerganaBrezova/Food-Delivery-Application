<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inika:wght@400;700&family=Modern+Antiqua&display=swap" rel="stylesheet">
    <title>Login</title>
    <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
<div class="login-container">
    <div class="login-left">
        <h1>Welcome Back!</h1>
            <br>
            <h3>Log in to access your personalized food delivery dashboard.</h3>
            <form th:action="@{/login}" th:method="POST" th:object="${loginRequest}">
                <br>
                <label for="username">Username</label>
                <br>
                <input type="text" id="username" name="username" placeholder="Username" th:field="*{username}">
                <br><br>

                <label for="password">Password</label>
                <br>
                <input type="password" id="password" name="password" placeholder="Password" th:field="*{password}">
                <small th:if="${errorMessage}" th:text="${errorMessage}"></small>
                <br><br>

                <button type="submit" class="login-btn" onclick="home.html">Log In</button>

                <br>
                <br>

                <p class="no-account">
                    Don't have an account?
                    <a th:href="@{/register}">Sign up</a>
                </p>

            </form>
    </div>

    <div class="login-right">

    </div>

</div>

</body>
</html>
