<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/categories.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>


    <title>Home page</title>
</head>
<body>
<header class="main-header">
    <div class="header-left">
        <img src="/images/home.jpg" alt="Logo" />
    </div>
    <div class="header-content">
        <h1 class="welcome-title">Welcome to Our Page!</h1>
        <h2 class="welcome-text">It’s time to power up your <br>day with flavor and focus. Grab your coffee (or pizza?) and let’s get things rolling.</h2>
            <br>
            <br>
            <br>
            <br>
            <br>
            <nav class="header-nav">
                <a href="#" class="nav-button"><i class="fas fa-home"></i> Home</a>
                <a href="#" class="nav-button"><i class="fas fa-shopping-basket"></i> Basket</a>
                <a href="#" class="nav-button"><i class="fas fa-chart-bar"></i> Statistics</a>
                <a href="#" class="nav-button"><i class="fas fa-receipt"></i> Orders</a>
                <a href="#" class="nav-button"><i class="fas fa-user"></i> Profile</a>
            </nav>
    </div>
</header>

<div class="top-controls">
    <button class="add-button">+</button>
</div>

<main class="categories-container">

    <a href="/products/appetizers" class="category-link">
        <div class="category-card appetizers">
            <h2 class="category-title">Appetizers</h2>
        </div>
    </a>

    <a href="/products/main" class="category-link">
        <div class="category-card main">
            <h2 class="category-title">Main</h2>
        </div>
    </a>

    <a href="/products/desserts" class="category-link">
        <div class="category-card desserts">
            <h2 class="category-title">Desserts</h2>
        </div>
    </a>

    <a href="/products/drinks" class="category-link">
        <div class="category-card drinks">
            <h2 class="category-title">Drinks</h2>
        </div>
    </a>


</main>




</body>



</html>
