<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/categories.css"/>
    <link rel="stylesheet" href="/css/nav-bar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <title>Categories</title>
</head>
<body>

<th:block th:insert="fragments/nav-bar :: main-header(${user})"></th:block>

<main class="categories-container">
    <a th:each="category : ${categories}"
       th:href="@{/products(brandId=${brandId}, location=${location}, categoryName=${category.name()})}"
       class="category-link">
        <div class="category-card"
             th:style="'background-image: url(/images/' + ${category.name().toLowerCase()} + '.jpg)'">
            <h2 class="category-title" th:text="${category.name()}"></h2>
        </div>
    </a>
</main>

</body>

</html>
