<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/statistics.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>


    <title>Profile</title>
</head>
<body>
<header class="main-header">
    <div class="header-left">
        <img src="/images/home.jpg" alt="Logo" />
    </div>
    <div class="header-content">
        <h1 class="welcome-title">Welcome to Our Page!</h1>
        <h2 class="welcome-text">It’s time to power up your <br>day with flavor and focus. Grab your coffee (or pizza?) and let’s get things rolling.</h2>
        <br>
        <br>
        <br>
        <br>
        <br>
        <nav class="header-nav">
            <a th:href="@{/home}" class="nav-button"><i class="fas fa-home"></i> Home</a>
            <a th:href="@{/orders/basket}" class="nav-button" th:if="${user.role.name() == 'CUSTOMER'}"><i class="fas fa-shopping-basket"></i> Basket</a>
            <a th:href="@{/company/statistics}" class="nav-button" th:if="${user.role.name() == 'EMPLOYEE'}">
                <i class="fas fa-chart-bar"></i>
                Statistics
            </a>
            <a th:href="@{/customers}" class="nav-button" th:if="${user.role.name() == 'EMPLOYEE'}">
                <i class="fas fa-users"></i>
                Customers
            </a>
            <a th:href="@{/orders}" class="nav-button" th:if="${user.role.name() == 'CUSTOMER'}"><i class="fas fa-receipt"></i> Orders</a>
            <a th:href="@{'/user/' + ${user.id} + '/profile'}" class="nav-button"><i class="fas fa-user"></i> Profile</a>
        </nav>
    </div>

</header>

<main class="courier-stats-container">
    <section class="stats-header">
        <h2>Courier Revenue Report</h2>

            <form th:action="@{/company/statistics/filter}" th:method="GET" class="date-filters">
                <label>
                    From:
                    <input type="datetime-local" name="from">
                </label>
                <label>
                    To:
                    <input type="datetime-local" name="to">
                </label>
                <button class="filter-button" type="submit">Filter</button>
            </form>

    </section>

    <section class="stats-table-wrapper">
        <table class="stats-table">
            <thead>
            <tr>
                <th>Courier</th>
                <th>Deliveries</th>
                <th>Revenue (€)</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="courier : ${allSystemCouriers}">
                <td th:text="${courier.firstName + ' ' + courier.lastName}"></td>
                <td th:text="${courier.getCompletedOrders().size()}"></td>
                <td th:text="${courier.generatedTurnover}"></td>
            </tr>

            </tbody>
            <tfoot>
            <tr>
                <td colspan="2" class="total-label">Total</td>
                <td class="total-revenue" th:text="'$' + ${#numbers.formatDecimal(revenue, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            </tfoot>
        </table>
    </section>
</main>


</body>
