<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/product-creation-edit.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>


    <title>Product Creation</title>
</head>
<body>
<header class="main-header">
    <div class="header-left">
        <img src="/images/home.jpg" alt="Logo" />
    </div>
    <div class="header-content">
        <h1 class="welcome-title">Welcome to Our Page!</h1>
        <h2 class="welcome-text">It’s time to power up your <br>day with flavor and focus. Grab your coffee (or pizza?) and let’s get things rolling.</h2>
            <br>
            <br>
            <br>
            <br>
            <br>
            <nav class="header-nav">
                <a th:href="@{/home}" class="nav-button"><i class="fas fa-home"></i> Home</a>
                <a th:href="@{/orders/basket}" class="nav-button" th:if="${user.role.name() == 'CUSTOMER'}"><i class="fas fa-shopping-basket"></i> Basket</a>
                <a href="#" class="nav-button" th:if="${user.role.name() == 'EMPLOYEE'}">
                    <i class="fas fa-chart-bar"></i>
                    Statistics
                </a>
                <a th:href="@{/orders}" class="nav-button" th:if="${user.role.name() == 'CUSTOMER'}"><i class="fas fa-receipt"></i> Orders</a>
                <a th:href="@{'/user/' + ${user.id} + '/profile'}" class="nav-button"><i class="fas fa-user"></i> Profile</a>
            </nav>
    </div>

</header>

<main class="add-brand-form">

    <h1>Add a new product</h1>

    <form th:action="@{/products/add}" th:method="POST" th:object="${createOrEditProductRequest}">

        <div class="product-info">

            <label for="image-url">Image:</label>
            <input type="text" id="image-url" placeholder="Enter image URL" th:field="*{imageUrl}">
            <small th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></small>

            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter name" th:field="*{name}">
            <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>

            <label for="price">Price:</label>
            <input type="number" id="price" placeholder="Enter price" step="0.1" th:field="*{price}">
            <small th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>

            <label for="category">Category:</label>
            <select id="category" th:field="*{category}">
                <option th:each="category : ${T(app.product.model.ProductCategory).values()}" th:value="${category}" th:text="${#strings.capitalize(#strings.toLowerCase(category))}"></option>
            </select>
            <small th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></small>

        </div>

        <button type="submit" class="submitBtn">Add</button>

    </form>

</main>

</body>
