<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/home.css"/>
    <link rel="stylesheet" href="/css/nav-bar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <title>Home page</title>
</head>
<body>

<th:block th:insert="fragments/nav-bar :: main-header(${user})"></th:block>

<div class="top-controls" th:if="${user.role.name() == 'EMPLOYEE'}">
    <a th:href="@{/company/add}" class="add-button">+</a>
</div>

<main class="brands-container" th:if="${user.role.name() == 'EMPLOYEE' or user.role.name() == 'CUSTOMER'}">

    <a class="brand-link" th:each="company : ${allCompanies}" th:attr="data-brand-id=${company.id}">

        <div class="brand-card">

            <form th:action="@{'/company/' + ${company.id} + '/delete'}" th:method="DELETE"
                  th:if="${user.role.name() == 'EMPLOYEE'}">
                <button type="submit" class="delete-button">×</button>
            </form>

            <img th:src="${company.logoUrl}" th:alt="${company.name}"/>
            <div class="brand-info">
                <h3 th:text="${company.name}"></h3>
                <p th:text="${company.description}"></p>
            </div>
        </div>
    </a>

</main>

<div class="start-day" th:if="${user.role.name() == 'COURIER'}">
    <h2 class="start-day-title">Ready to start your day?</h2>
    <br>
    <br>
    <a href="#" class="start-button">Start Work Day</a>
    <br>
    <br>
    <br>
    <p class="start-day-message">Start with a smile, stay on time, and bring great vibes to every delivery!</p>
</div>


<div id="location-popup" class="popup-overlay">
    <div class="popup-content">
        <button id="close-popup" class="close-btn">×</button>
        <h2>Please choose a location of the restaurant.</h2>
        <br>

        <select id="location">
            <option value="Sofia">Sofia</option>
            <option value="Plovdiv">Plovdiv</option>
        </select>

        <button id="submit-location">Continue</button>

        <div th:if="${user.role.name() == 'EMPLOYEE'}">
            <h2 class="or-add-restaurant">Or</h2>
            <a th:href="@{/restaurant/add}" id="submit-add">Add Restaurant</a>
        </div>

    </div>
</div>

<script>
    let selectedBrandId = null;

    document.querySelectorAll('.brand-card').forEach((card, index) => {
        card.addEventListener('click', () => {
            selectedBrandId = document.querySelectorAll('.brand-link')[index].getAttribute('data-brand-id');
            document.getElementById('location-popup').style.display = 'flex';
        });
    });

    document.getElementById('close-popup').addEventListener('click', () => {
        document.getElementById('location-popup').style.display = 'none';
    });

    document.getElementById('submit-location').addEventListener('click', () => {
        const location = document.getElementById('location').value;
        if (location && selectedBrandId) {
            window.location.href = `/restaurant/categories/${selectedBrandId}/location/${location}`;
        } else {
            alert('Please select a location.');
        }
    });
</script>


</body>


</html>
