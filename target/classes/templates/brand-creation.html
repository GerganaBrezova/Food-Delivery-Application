<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/brand-creation.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>


  <title>Brand Creation</title>
</head>
<body>
<header class="main-header">
  <div class="header-left">
    <img src="/images/home.jpg" alt="Logo" />
  </div>
  <div class="header-content">
    <h1 class="welcome-title">Welcome to Our Page!</h1>
    <h2 class="welcome-text">It’s time to power up your <br>day with flavor and focus. Grab your coffee (or pizza?) and let’s get things rolling.</h2>
    <br>
    <br>
    <br>
    <br>
    <br>
    <nav class="header-nav">
      <a th:href="@{/home}" class="nav-button"><i class="fas fa-home"></i> Home</a>
      <a th:href="@{/orders/basket}" class="nav-button" th:if="${user.role.name() == 'CUSTOMER'}"><i class="fas fa-shopping-basket"></i> Basket</a>
      <a th:href="@{/company/statistics}" class="nav-button" th:if="${user.role.name() == 'EMPLOYEE'}">
        <i class="fas fa-chart-bar"></i>
        Statistics
      </a>
      <a th:href="@{/customers}" class="nav-button" th:if="${user.role.name() == 'EMPLOYEE'}">
        <i class="fas fa-users"></i>
        Customers
      </a>
      <a th:href="@{/orders}" class="nav-button" th:if="${user.role.name() == 'CUSTOMER'}"><i class="fas fa-receipt"></i> Orders</a>
      <a th:href="@{'/user/' + ${user.id} + '/profile'}" class="nav-button"><i class="fas fa-user"></i> Profile</a>
    </nav>
  </div>

</header>

<main class="add-brand-form">
  <h1>Add a new brand</h1>

  <form id="brandForm" th:action="@{/company/add}" th:method="POST" th:object="${createCompanyRequest}">

    <div class="brand-info">

      <label for="logo-url">Brand photo (URL link):</label>
      <input type="text" id="logo-url" placeholder="Enter image URL" th:field="*{logoUrl}">
      <small th:if="${#fields.hasErrors('logoUrl')}" th:errors="*{logoUrl}"></small>

      <label for="name">Brand Name:</label>
      <input type="text" id="name" placeholder="Enter name" th:field="*{name}">
      <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>

      <label for="description">Brand Motto:</label>
      <input type="text" id="description" placeholder="Enter motto" th:field="*{description}">
      <small th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small>

    </div>

    <button type="submit" class="submitBtn">Save brand</button>

  </form>
</main>

</body>
